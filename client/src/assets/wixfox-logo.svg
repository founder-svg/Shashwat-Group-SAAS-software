<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="55%" stop-color="#FF8C35"/>
      <stop offset="100%" stop-color="#1A6FD4"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF8C35"/>
    </linearGradient>
    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card Matching www.wixfox.com -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#wfBg)" filter="url(#wfGlow)"/>
  <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Geometric Modern Fox Emblem (WixFox) -->
  <!-- Left Outer Ear -->
  <polygon points="32,24 48,52 20,52" fill="#FFFFFF" opacity="0.95"/>
  <!-- Left Inner Ear -->
  <polygon points="32,30 44,48 24,48" fill="url(#earInner)"/>

  <!-- Right Outer Ear -->
  <polygon points="88,24 100,52 72,52" fill="#FFFFFF" opacity="0.95"/>
  <!-- Right Inner Ear -->
  <polygon points="88,30 96,48 76,48" fill="url(#earInner)"/>

  <!-- Crown / Forehead -->
  <polygon points="60,42 28,52 60,66" fill="#FFFFFF" opacity="0.98"/>
  <polygon points="60,42 92,52 60,66" fill="#FFFFFF" opacity="0.98"/>

  <!-- Cheeks -->
  <polygon points="20,52 40,74 60,66" fill="#F8FAFC" opacity="0.92"/>
  <polygon points="100,52 80,74 60,66" fill="#F8FAFC" opacity="0.92"/>

  <!-- Snout / Nose Bridge -->
  <polygon points="60,66 48,82 60,94" fill="#FFFFFF"/>
  <polygon points="60,66 72,82 60,94" fill="#E2E8F0"/>

  <!-- Nose Tip -->
  <polygon points="60,89 54,94 66,94" fill="#0A0C10"/>

  <!-- Modern Sleek Eyes -->
  <polygon points="41,59 49,63 43,65" fill="#0A0C10"/>
  <polygon points="79,59 71,63 77,65" fill="#0A0C10"/>
</svg>
