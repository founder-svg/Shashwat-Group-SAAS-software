# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION FOR SHASHWAT GROUP CRM
# ==============================================================================

[build]
  command = "node build-netlify.js"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Single-Page Application (SPA) Routing Rule (prevents 404 on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
