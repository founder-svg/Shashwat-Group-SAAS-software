# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION FOR SHASHWAT GROUP CRM
# ==============================================================================

[build]
  command = "if [ -d \"client\" ]; then cd client; fi && npm install --legacy-peer-deps && npm run build && mkdir -p ../client/dist ../dist dist && cp -r dist/* ../client/dist/ 2>/dev/null || true && cp -r dist/* ../dist/ 2>/dev/null || true"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Single-Page Application (SPA) Routing Rule (prevents 404 on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
